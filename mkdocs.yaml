site_name: Backstage Plugin — Sandboxd
site_description: A Backstage plugin that integrates with sandboxd, the Go control-plane service for managing sandbox containers.
repo_url: https://github.com/veracode/backstage-plugin-sandboxd
theme:
  name: material
  palette:
    primary: blue
    accent: light blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - search.highlight
    - search.suggest
nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Migration Guide: migration-guide.md
  - Configuration: configuration.md
  - Frontend Plugin:
    - frontend.md
    - AppCard: frontend-appcard.md
    - SandboxdContent (Tabs): frontend-content.md
    - Code Editor: frontend-code-editor.md
    - Terminal: frontend-terminal.md
    - Agent Tasks: frontend-agent-tasks.md
    - App Store: frontend-app-store.md
    - Agent Credentials: frontend-agent-credentials.md
    - API Key Management: frontend-api-key-management.md
    - Preview URL Auth: frontend-preview-url-auth.md
    - Preview Iframe: frontend-preview-iframe.md
    - Annotations: frontend-annotations.md
    - API Hooks: frontend-api-hooks.md
  - Backend Plugin:
    - backend.md
    - Router & Proxy: backend-router.md
    - Health Check: backend-health.md
    - Auto-Provisioning: backend-provisioning.md
    - Entity Sync: backend-entity-sync.md
    - SSE Proxy: backend-sse.md
    - Scaffolder Action: backend-scaffolder.md
    - Authentication: backend-auth.md
    - Identity Resolution: backend-identity.md
    - Preview URL Auth Gate: backend-preview-auth.md
  - Scaffolder Templates: templates.md
  - API Reference: api-reference.md
  - Testing: testing.md
  - CI Pipeline: ci-pipeline.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - tables
  - toc:
      permalink: true
